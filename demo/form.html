<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Demo Shipping Portal</title>
<style>body{font:15px system-ui;max-width:640px;margin:40px auto;padding:0 16px}label{display:block;margin:10px 0 4px}input,select{width:100%;padding:8px}button{margin-top:16px;padding:10px 18px}#ok{display:none;color:green;font-weight:600}</style></head>
<body>
<h1>Demo Shipping Portal</h1>
<p>Local test page. The bot never touches a real carrier site in this repo.</p>
<form id="ship">
  <fieldset><legend>Recipient</legend>
    <label for="name">Full name</label><input id="name" name="name" required>
    <label for="company">Company</label><input id="company" name="company">
    <label for="address">Street address</label><input id="address" name="address" required>
    <label for="city">City</label><input id="city" name="city" required>
    <label for="zip">Postal code</label><input id="zip" name="zip" required>
    <label for="country">Country</label><select id="country" name="country"><option value="US">United States</option><option value="GB">United Kingdom</option><option value="TR">Türkiye</option></select>
  </fieldset>
  <fieldset><legend>Package</legend>
    <label for="weight">Weight (kg)</label><input id="weight" name="weight" type="number" step="0.1" required>
    <label for="service">Service</label><select id="service" name="service"><option value="ground">Ground</option><option value="express">Express</option></select>
  </fieldset>
  <button type="submit">Create shipment</button>
</form>
<p id="ok">Shipment created: <span id="ref"></span></p>
<script>
document.getElementById('ship').addEventListener('submit', e => {
  e.preventDefault();
  const ref = 'DEMO-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  document.getElementById('ref').textContent = ref;
  document.getElementById('ok').style.display = 'block';
});
</script>
</body></html>
